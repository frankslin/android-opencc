name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_PACKAGES: platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out (with the OpenCC submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install the SDK components pinned by the build
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # shellcheck disable=SC2086
          "$SDKMANAGER" --install $SDK_PACKAGES

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, lint and run unit tests
        run: ./gradlew build --stacktrace

      - name: Check that the library publishes (POM, AAR, sources jar)
        run: ./gradlew :lib-opencc-android:publishToMavenLocal --stacktrace

      - name: Upload the library AAR
        uses: actions/upload-artifact@v4
        with:
          name: lib-opencc-android
          path: lib-opencc-android/build/outputs/aar/*.aar
          if-no-files-found: error

  instrumented-tests:
    name: Instrumented tests (API 30 x86_64 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out (with the OpenCC submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install the SDK components pinned by the build
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # shellcheck disable=SC2086
          "$SDKMANAGER" --install $SDK_PACKAGES

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run ApplicationTest on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :lib-opencc-android:connectedAndroidTest --stacktrace

      - name: Upload the instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: lib-opencc-android/build/reports/androidTests/connected/
          if-no-files-found: ignore
