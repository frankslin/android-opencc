name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The build still pins the 2021 toolchain (AGP 4.2.1, Gradle 6.7.1, NDK r21,
# CMake 3.18.1, SDK 30). Two consequences for CI:
#
# - Gradle 6.7.1 runs on JDK 8-15 only, while the SDK's current cmdline-tools
#   (sdkmanager, avdmanager) need JDK 17. The runner image preinstalls both,
#   so JAVA_HOME is set to 17 for the SDK tools and the Gradle invocations
#   pass JDK 11 explicitly.
# - NDK r21's clang links against libtinfo.so.5, which Ubuntu 24.04 no longer
#   packages, so the jobs run on ubuntu-22.04 where it can still be installed.
#
# Both workarounds go away once the toolchain is upgraded.

env:
  SDK_PACKAGES: platforms;android-30 build-tools;30.0.3 ndk;21.1.6352462 cmake;3.18.1

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out (with the OpenCC submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install the SDK components pinned by the build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libtinfo5 libncurses5
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # shellcheck disable=SC2086
          "$SDKMANAGER" --install $SDK_PACKAGES

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, lint and run unit tests
        run: JAVA_HOME="$JAVA_HOME_11_X64" ./gradlew build --stacktrace

      - name: Upload the library AAR
        uses: actions/upload-artifact@v4
        with:
          name: lib-opencc-android
          path: lib-opencc-android/build/outputs/aar/*.aar
          if-no-files-found: error

  instrumented-tests:
    name: Instrumented tests (API 30 x86_64 emulator)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out (with the OpenCC submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the SDK components pinned by the build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libtinfo5 libncurses5
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # shellcheck disable=SC2086
          "$SDKMANAGER" --install $SDK_PACKAGES

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run ApplicationTest on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: JAVA_HOME="$JAVA_HOME_11_X64" ./gradlew :lib-opencc-android:connectedAndroidTest --stacktrace

      - name: Upload the instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: lib-opencc-android/build/reports/androidTests/connected/
          if-no-files-found: ignore
