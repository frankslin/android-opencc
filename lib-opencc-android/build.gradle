plugins {
    id 'com.android.library'
}

android {
    namespace 'com.zqc.opencc.android.lib'
    compileSdk 35
    ndkVersion '21.1.6352462'

    defaultConfig {
        minSdk 14
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles 'consumer-rules.pro'

        externalNativeBuild {
            cmake {
                // Only libChineseConverter.so is wanted in the AAR; OpenCC's
                // command line tools and dictionary generation targets are
                // excluded from the build (see src/main/jni/CMakeLists.txt).
                targets 'ChineseConverter'
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/jni/CMakeLists.txt'
            // OpenCC's CMakeLists.txt requires CMake >= 3.12, so the 3.10.2
            // that AGP would otherwise pick is not enough.
            version '3.18.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test:core:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.3.0'
    androidTestImplementation 'androidx.test:rules:1.3.0'
}
