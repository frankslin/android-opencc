plugins {
    id 'com.android.library'
    id 'maven-publish'
}

// Maven coordinates of the published AAR. JitPack rewrites group and version
// to com.github.<user>:<repo>:<tag> when it builds a tag, so the version here
// only matters for publishToMavenLocal and other repositories.
group = 'com.github.frankslin'
version = System.getenv('VERSION') ?: '1.3.0-SNAPSHOT'

android {
    namespace 'com.zqc.opencc.android.lib'
    compileSdk 35
    // NDK r26+ builds for API 21 and up; r27 aligns shared libraries to
    // 16 KB pages by default (Android 15+ devices may use them).
    ndkVersion '27.2.12479018'

    defaultConfig {
        minSdk 21
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles 'consumer-rules.pro'

        externalNativeBuild {
            cmake {
                // Only libChineseConverter.so is wanted in the AAR; OpenCC's
                // command line tools and dictionary generation targets are
                // excluded from the build (see src/main/jni/CMakeLists.txt).
                targets 'ChineseConverter'
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/jni/CMakeLists.txt'
            // OpenCC's CMakeLists.txt requires CMake >= 3.12. 3.22.1 is the
            // version the SDK ships and AGP 8 defaults to; pinned so every
            // machine configures with the same one.
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                artifactId = 'android-opencc'
                pom {
                    name = 'android-opencc'
                    description = 'Conversion between Traditional and Simplified Chinese on Android, powered by OpenCC'
                    url = 'https://github.com/frankslin/android-opencc'
                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://opensource.org/licenses/MIT'
                        }
                    }
                    scm {
                        url = 'https://github.com/frankslin/android-opencc'
                        connection = 'scm:git:https://github.com/frankslin/android-opencc.git'
                    }
                }
            }
        }
    }
}

dependencies {
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}
