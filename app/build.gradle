plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zqc.opencc.android'
    compileSdk 35
    // Only used to strip the library's native symbols when packaging.
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.zqc.opencc.android'
        minSdk 21
        targetSdk 35
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation project(':lib-opencc-android')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // appcompat 1.7.0 brings kotlin-stdlib 1.8.x, in which the jdk7/jdk8
    // classes were merged into the main artifact; older transitive
    // kotlin-stdlib-jdk7/jdk8 1.6.x would otherwise duplicate them.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
